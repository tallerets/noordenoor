<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola soc la Noor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia Pro', Georgia, serif;
            line-height: 1.6;
            color: #333;
        }

        header {
            background-color: #8b7355;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            padding: 0 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-family: 'Futura', sans-serif;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 0.8;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .hero-image {
            width: 100%;
            height: auto;
            margin: 40px 0;
            border-radius: 8px;
        }

        .hero-title {
            font-family: 'Futura', sans-serif;
            font-size: 48px;
            text-align: center;
            margin: 40px 0;
            color: #333;
        }

        .images-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin: 40px 0;
        }

        .gallery-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }

        .hero-subtitle {
            font-family: 'Futura', sans-serif;
            font-size: 28px;
            text-align: center;
            color: #555;
            margin: 50px 0 60px 0;
            line-height: 1.4;
        }

        .contact-section {
            background-color: #f9f9f9;
            padding: 50px 30px;
            border-radius: 8px;
            margin: 80px 0;
        }

        .contact-title {
            font-family: 'Futura', sans-serif;
            font-size: 36px;
            margin-bottom: 40px;
            text-align: center;
            color: #333;
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            margin-bottom: 40px;
        }

        .contact-item {
            text-align: center;
        }

        .contact-label {
            font-family: 'Futura', sans-serif;
            font-weight: bold;
            font-size: 16px;
            color: #8b7355;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .contact-value {
            font-size: 18px;
            color: #333;
            word-break: break-all;
        }

        .contact-value a {
            color: #4a90e2;
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact-value a:hover {
            color: #8b7355;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-links a {
            color: white;
            background-color: #8b7355;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-family: 'Futura', sans-serif;
            transition: background-color 0.3s;
        }

        .social-links a:hover {
            background-color: #6a5444;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            .hero-title {
                font-size: 32px;
            }

            .hero-subtitle {
                font-size: 20px;
            }

            .images-gallery {
                grid-template-columns: 1fr;
            }

            .contact-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">hola soc la noor</a>
            <a href="que-faig.html">Que faig ?</a>
            <a href="qui-soc.html">qui soc</a>
        </nav>
    </header>

    <div class="container">
        <!-- Hero Image -->
        <img src="https://via.placeholder.com/1200x400?text=Horizontal+Image" alt="Noor" class="hero-image">

        <!-- Main Title -->
        <h1 class="hero-title">Hola, soc la Noor</h1>

        <!-- Gallery Images -->
        <div class="images-gallery">
            <img src="https://via.placeholder.com/400x300?text=Image+1" alt="Gallery Image 1" class="gallery-image">
            <img src="https://via.placeholder.com/400x300?text=Image+2" alt="Gallery Image 2" class="gallery-image">
        </div>

        <!-- Subtitle -->
        <h2 class="hero-subtitle">Docent, facilitadora i creadora de projectes creatius i comunitaris</h2>

        <!-- Contact Section -->
        <div class="contact-section">
            <h2 class="contact-title">Contacte</h2>
            
            <div class="contact-info">
                <div class="contact-item">
                    <div class="contact-label">Telèfon</div>
                    <div class="contact-value">
                        <a href="tel:+34658237140">658 23 71 40</a>
                    </div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-label">Email</div>
                    <div class="contact-value">
                        <a href="mailto:soclanoor@gmail.com">soclanoor@gmail.com</a>
                    </div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-label">Xarxes Socials</div>
                    <div class="contact-value">@noordenoor_</div>
                </div>
            </div>

            <div class="social-links">
                <a href="https://instagram.com/noordenoor_" target="_blank">Instagram</a>
                <a href="https://linkedin.com/in/noordenoor" target="_blank">LinkedIn</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Noor. Tots els drets reservats.</p>
    </footer>
</body>
</html>
