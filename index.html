<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola soc la Noor</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&family=Futura:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'EB Garamond', 'Georgia Pro', Georgia, serif;
            line-height: 1.6;
            color: #333;
        }

        header {
            background-color: #8b7355;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: flex-end;
            gap: 40px;
            padding: 0 60px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-family: 'Futura', sans-serif;
            transition: opacity 0.3s;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        nav a:hover {
            opacity: 0.8;
        }

        .hero-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 0;
        }

        h1 {
            font-family: 'Futura', sans-serif;
            font-size: 64px;
            text-align: center;
            margin: 80px 0 40px 0;
            color: #333;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .images-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 60px;
        }

        .gallery-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
        }

        .hero-subtitle {
            font-family: 'Futura', sans-serif;
            font-size: 24px;
            text-align: center;
            color: #555;
            margin: 80px 60px 120px 60px;
            line-height: 1.6;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .contact-section {
            background-color: #f5f1eb;
            padding: 60px;
            margin: 0;
        }

        .contact-title {
            font-family: 'Futura', sans-serif;
            font-size: 48px;
            margin-bottom: 60px;
            text-align: center;
            color: #333;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 60px;
            max-width: 1200px;
            margin: 0 auto 40px;
        }

        .contact-item {
            text-align: center;
        }

        .contact-label {
            font-family: 'Futura', sans-serif;
            font-weight: 700;
            font-size: 14px;
            color: #8b7355;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-value {
            font-size: 18px;
            color: #333;
            word-break: break-all;
            font-family: 'EB Garamond', 'Georgia Pro', Georgia, serif;
        }

        .contact-value a {
            color: #4a90e2;
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact-value a:hover {
            color: #8b7355;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .social-links a {
            color: white;
            background-color: #8b7355;
            padding: 12px 24px;
            border-radius: 5px;
            text-decoration: none;
            font-family: 'Futura', sans-serif;
            transition: background-color 0.3s;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .social-links a:hover {
            background-color: #6a5444;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 15px;
                padding: 0 20px;
            }

            h1 {
                font-size: 40px;
                margin: 40px 0 20px 0;
            }

            .hero-subtitle {
                font-size: 18px;
                margin: 40px 20px 60px 20px;
            }

            .images-gallery {
                grid-template-columns: 1fr;
                padding: 0 20px;
                margin: 20px auto;
            }

            .contact-info {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 0 20px;
            }

            .contact-section {
                padding: 40px 20px;
            }

            .contact-title {
                font-size: 32px;
                margin-bottom: 40px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">hola soc la noor</a>
            <a href="que-faig.html">Que faig ?</a>
            <a href="qui-soc.html">qui soc</a>
        </nav>
    </header>

    <div class="container">
        <!-- Hero Image -->
        <img src="https://via.placeholder.com/1600x400?text=Horizontal+Hero+Image" alt="Noor" class="hero-image">

        <!-- Main Title -->
        <h1>Hola, soc la Noor</h1>

        <!-- Gallery Images -->
        <div class="images-gallery">
            <img src="https://via.placeholder.com/400x300?text=Image+1" alt="Gallery Image 1" class="gallery-image">
            <img src="https://via.placeholder.com/400x300?text=Image+2" alt="Gallery Image 2" class="gallery-image">
        </div>

        <!-- Subtitle -->
        <h2 class="hero-subtitle">Docent, facilitadora i creadora de projectes creatius i comunitaris</h2>

        <!-- Contact Section -->
        <div class="contact-section">
            <h2 class="contact-title">Contacte</h2>
            
            <div class="contact-info">
                <div class="contact-item">
                    <div class="contact-label">Telèfon</div>
                    <div class="contact-value">
                        <a href="tel:+34658237140">658 23 71 40</a>
                    </div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-label">Email</div>
                    <div class="contact-value">
                        <a href="mailto:soclanoor@gmail.com">soclanoor@gmail.com</a>
                    </div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-label">Xarxes Socials</div>
                    <div class="contact-value">@noordenoor_</div>
                </div>
            </div>

            <div class="social-links">
                <a href="https://instagram.com/noordenoor_" target="_blank">Instagram</a>
                <a href="https://linkedin.com/in/noordenoor" target="_blank">LinkedIn</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Noor. Tots els drets reservats.</p>
    </footer>
</body>
</html>
